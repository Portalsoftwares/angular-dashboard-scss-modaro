<div class="container">
  <form (ngSubmit)="onSubmit()" #studentForm="ngForm">
    <div>
      <label for="name">Nome:</label>
      <input type="text" id="name" [(ngModel)]="student!.name" name="name" required>
    </div>
    <div>
      <label for="age">Idade:</label>
      <input type="number" id="age" [(ngModel)]="student!.age" name="age" required>
    </div>
    <div>
      <label for="grade">Brade:</label>
      <input type="text" id="grade" [(ngModel)]="student!.grade" name="grade" required>
    </div>
    <button type="submit" [disabled]="!studentForm.form.valid">Salvar</button>
  </form>
</div>

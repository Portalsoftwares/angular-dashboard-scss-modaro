
<div class="student-create">
  <div class="form-container">
    <form (ngSubmit)="onSubmit()" #studentForm="ngForm">
      <div class="form-group">
        <label for="name">Nome:</label>
        <input type="text" id="name" [(ngModel)]="student.name" name="name" required>
      </div>
      <div class="form-group">
        <label for="age">Idade:</label>
        <input type="number" id="age" [(ngModel)]="student.age" name="age" required>
      </div>
      <div class="form-group">
        <label for="grade">Email:</label>
        <input type="text" id="grade" [(ngModel)]="student.grade" name="grade" required>
      </div>
      <button type="submit" class="submit-btn" [disabled]="!studentForm.form.valid">Salvar</button>
    </form>
  </div>
</div>
